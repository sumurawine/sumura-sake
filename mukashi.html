<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>すむら酒店 ｜ 昔日</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;
 background:#efe9dc;
 background-image:
   radial-gradient(circle at 20% 15%,rgba(120,95,60,.10),transparent 55%),
   radial-gradient(circle at 82% 78%,rgba(120,95,60,.09),transparent 55%);
 color:#3c3428;
 font-family:"Hiragino Mincho ProN","ヒラギノ明朝 ProN","Yu Mincho","游明朝","Noto Serif JP","MS PMincho",serif;
 font-size:17px;line-height:2;letter-spacing:.03em;padding:60px 22px 90px}
.mk-wrap{max-width:760px;margin:0 auto;text-align:center;
 animation:mkIn 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes mkIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.mk-title{font-size:34px;letter-spacing:.5em;text-indent:.5em;color:#5a4a33;font-weight:400}
.mk-en{margin-top:10px;font-size:11px;letter-spacing:.42em;text-indent:.42em;color:#9c8d75;text-transform:uppercase}
.mk-photo{margin:44px auto 0;max-width:640px;padding:14px 14px 46px;background:#fbf8f1;
 box-shadow:0 2px 3px rgba(60,45,25,.12),0 18px 44px rgba(60,45,25,.18);
 transform:rotate(-.5deg)}
.mk-photo img{display:block;width:100%;height:auto;filter:sepia(.28) contrast(1.03)}
.mk-cap{margin-top:-34px;position:relative;font-size:14px;color:#8b7c64;letter-spacing:.14em}
.mk-rule{width:46px;height:1px;background:#c9bda6;margin:52px auto}
.mk-wrap p{margin:20px 0;color:#453b2c;text-align:left}
.mk-sig{margin-top:40px;font-size:15px;color:#8b7c64;letter-spacing:.2em}
.mk-back{display:inline-block;margin-top:52px;padding:11px 28px;text-decoration:none;
 border:1px solid #c9bda6;color:#5a4a33;font-size:14px;letter-spacing:.12em;background:#fbf8f1;
 transition:background .25s,border-color .25s}
.mk-back:hover{background:#f4efe4;border-color:#a89madeup}
.mk-back:hover{background:#f4efe4;border-color:#a8977c}
@media (max-width:600px){
 body{padding:44px 16px 80px;font-size:16px}
 .mk-title{font-size:26px}
 .mk-photo{padding:10px 10px 38px}
 .mk-cap{margin-top:-28px}
}
#lang-bar{position:fixed;right:6px;top:6px;z-index:50;background:#fbf8f1;border:1px solid #c9bda6;
 padding:4px 7px;border-radius:3px;box-shadow:0 2px 10px rgba(60,45,25,.14)}
#lang-bar button{background:none;border:1px solid transparent;cursor:pointer;font-size:19px;padding:1px 4px;opacity:.42;line-height:1.15}
#lang-bar button:hover{opacity:.8}
#lang-bar button.active{opacity:1;border-color:#a8977c;background:#f0e9da}
</style>
<link rel="stylesheet" href="eras.css?v=8">
<script src="era.js?v=8"></script>
</head>
<body>
<div class="mk-wrap">
  <div class="mk-title" data-i18n="mk-title">昔日</div>
  <div class="mk-en">Liquor Shop Sumura</div>

  <div class="mk-photo"><img src="images/showa30.webp" alt="昭和30年頃のすむら酒店" width="900" height="693"></div>
  <div class="mk-cap" data-i18n="mk-cap">昭和30年頃の様子</div>

  <div class="mk-rule"></div>

  <p data-i18n="mk-p1">1998年にネットショップを開店するまで、弊店のウェブサイトは存在しておりませんでした。</p>
  <p data-i18n="mk-p2">大変長い間、皆様方にお世話になっております。今後とも引き続きご愛顧の程、よろしくお願い致します。</p>

  <div class="mk-sig" data-i18n="mk-sig">すむら酒店　店主</div>

  <a class="mk-back" href="home.html" data-i18n="mk-back">← 店内へ戻る</a>
</div>

<script>
(function(){
const T={"en":{"[data-i18n=\"mk-title\"]":"The Old Days","[data-i18n=\"mk-cap\"]":"Our shop around 1955","[data-i18n=\"mk-p1\"]":"Until we opened our online shop in 1998, this shop had no website at all.","[data-i18n=\"mk-p2\"]":"For a very long time we have been in your care. We hope you will continue to favour us with your custom.","[data-i18n=\"mk-sig\"]":"Liquor Shop Sumura","[data-i18n=\"mk-back\"]":"← Back to the shop"},
"fr":{"[data-i18n=\"mk-title\"]":"Autrefois","[data-i18n=\"mk-cap\"]":"Notre boutique vers 1955","[data-i18n=\"mk-p1\"]":"Jusqu’à l’ouverture de notre boutique en ligne en 1998, notre maison n’avait aucun site web.","[data-i18n=\"mk-p2\"]":"Depuis fort longtemps, nous vous devons beaucoup. Nous espérons continuer à mériter votre confiance.","[data-i18n=\"mk-sig\"]":"Liquor Shop Sumura","[data-i18n=\"mk-back\"]":"← Retour à la boutique"},
"zh":{"[data-i18n=\"mk-title\"]":"昔日","[data-i18n=\"mk-cap\"]":"昭和30年（1955年）前后的店铺","[data-i18n=\"mk-p1\"]":"直到1998年开设网店之前，本店并没有网站。","[data-i18n=\"mk-p2\"]":"长久以来承蒙各位关照。今后也请继续惠顾。","[data-i18n=\"mk-sig\"]":"洲村酒店　店主","[data-i18n=\"mk-back\"]":"← 返回店内"},
"ko":{"[data-i18n=\"mk-title\"]":"옛날","[data-i18n=\"mk-cap\"]":"1955년 무렵의 모습","[data-i18n=\"mk-p1\"]":"1998년에 온라인 숍을 열기까지, 저희 가게에는 웹사이트가 없었습니다.","[data-i18n=\"mk-p2\"]":"아주 오랜 세월 동안 여러분께 신세를 지고 있습니다. 앞으로도 변함없는 애호를 부탁드립니다.","[data-i18n=\"mk-sig\"]":"스무라 주점　주인","[data-i18n=\"mk-back\"]":"← 가게로 돌아가기"}};
const bar=document.createElement('div');bar.id='lang-bar';
bar.innerHTML='<button data-lang="jp">🇯🇵</button><button data-lang="en">🇬🇧</button><button data-lang="fr">🇫🇷</button><button data-lang="zh">🇨🇳</button><button data-lang="ko">🇰🇷</button>';
document.body.appendChild(bar);
function applyLang(lang){const t=T[lang];if(!t)return;Object.entries(t).forEach(([sel,html])=>{try{document.querySelectorAll(sel).forEach(el=>{if(!el.querySelector('img,canvas,svg')){el.innerHTML=html;}});}catch(e){}});bar.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));if(window.__afterLang){try{window.__afterLang(lang);}catch(e){}}}
bar.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{const lang=btn.dataset.lang;localStorage.setItem('lang',lang);if(lang==='jp'){location.reload();return;}applyLang(lang);}));
const saved=localStorage.getItem('lang')||'jp';
if(saved==='jp'){const jb=bar.querySelector('[data-lang="jp"]');if(jb)jb.classList.add('active');}else{applyLang(saved);}
})();
</script>
</body>
</html>
