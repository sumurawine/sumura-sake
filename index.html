<script>
(function(){
  var stage=document.getElementById('stage'),link=document.getElementById('doorlink'),

  var KN={jp:['コン','コン','ギィ…'],en:['knock','knock','creak…'],fr:['toc','toc','crrr…'],zh:['咚','咚','吱—'],ko:['똑','똑','끼익…']};
  function lang(){try{return localStorage.getItem('lang')||'jp';}catch(e){return 'jp';}}
  var AC=null;
  function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=false;}}return AC||null;}
  function thump(freq,dur,vol){
    var c=ac();if(!c)return;
    var o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
    o.type='sine';o.frequency.setValueAtTime(freq,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.35),c.currentTime+dur);
    f.type='lowpass';f.frequency.value=900;
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008,c.currentTime+dur);
    o.connect(f);f.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+dur+0.05);
  }
  function creak(){
    var c=ac();if(!c)return;
    var o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();

    f.type='lowpass';f.frequency.value=1400;
    g.gain.setValueAtTime(0.05,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008,c.currentTime+0.95);
    o.connect(f);f.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+1);
  }
  var busy=false;
  function open(e){

      }else{
        stage.classList.remove('knocking');
        txt.textContent=w[2];txt.classList.remove('show');void txt.offsetWidth;txt.classList.add('show');
        stage.classList.add('opening');creak();
        setTimeout(function(){flash.classList.add('on');},760);
        setTimeout(function(){location.href='home.html';},1220);
      }
    })();
  }
  link.addEventListener('click',open);
  if(enter)enter.addEventListener('click',open);
})();
