name: サイトを公開（Next.js版）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: 背景ビジュアルを生成
        run: |
          pip install --quiet --disable-pip-version-check pillow numpy
          python3 scripts/make-visuals.py

      - name: ビルド
        env:
          BASE_PATH: /sumura-sake
          ASSET_BASE: /sumura-sake
        run: npm run build

      - name: Jekyll を無効化（_next/ を配信するため）
        run: touch out/.nojekyll

      - name: 検討中の版を /preview/ にも出す（next ブランチ）
        continue-on-error: true
        run: |
          git clone --depth 1 -b next https://github.com/${{ github.repository }}.git /tmp/nextsrc || exit 0
          cd /tmp/nextsrc
          npm install --no-audit --no-fund
          python3 scripts/make-visuals.py || true
          BASE_PATH=/sumura-sake/preview ASSET_BASE=/sumura-sake/preview npm run build
          mkdir -p "$GITHUB_WORKSPACE/out/preview"
          cp -r out/. "$GITHUB_WORKSPACE/out/preview/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
