name: Next.js版のプレビューを公開

on:
  push:
    branches: [next]
  workflow_dispatch:

concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: ビルド（/preview 配下に丸ごと出力）
        env:
          BASE_PATH: /sumura-sake/preview
          ASSET_BASE: /sumura-sake/preview
        run: npm run build

      - name: main の preview/ に配置（公開中のサイトはそのまま）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add /tmp/mainwt origin/main
          rm -rf /tmp/mainwt/preview
          mkdir -p /tmp/mainwt/preview
          cp -r out/. /tmp/mainwt/preview/
          touch /tmp/mainwt/.nojekyll /tmp/mainwt/preview/.nojekyll
          cd /tmp/mainwt
          git add -A preview .nojekyll
          git commit -m "preview: Next.js版のビルド" || echo "変更なし"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            echo "他の実行と競合したので取り直します（$i回目）"
            git fetch origin main
            git reset --soft origin/main
            git commit -m "preview: Next.js版のビルド" || true
            sleep 5
          done
